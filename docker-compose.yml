version: '2.0'
services:
  # mongo database
  mongodb:
    image: bitnami/mongodb:4.2
    restart: always
    environment:
      - MONGODB_USERNAME=wottactics
      - MONGODB_PASSWORD=wottactics
      - MONGODB_DATABASE=wottactics
      - MONGODB_ROOT_PASSWORD=wottactics
    volumes:
       - mongodb-data:/bitnami
  # redis server
  redis:
    restart: always
    image: 'bitnami/redis:latest'
    environment:
      - REDIS_PASSWORD=wottactics
    volumes:
      - redis-data:/bitnami/redis/data
  # wottactis nodejs app
  nodejs:
    restart: always
    build:
      context: .
    depends_on:
      - mongodb
      - redis
    ports:
      - 8000:80
    links:
      - mongodb
      - redis
    volumes:
      - ./views:/usr/src/app/views
      - ./public:/usr/src/app/public
      - ./helper:/helper

# these volumes are necessary to make the data persitent
volumes:
  mongodb-data:
  redis-data:

